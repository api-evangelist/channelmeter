aid: channelmeter
name: ChannelMeter
description: >-
  ChannelMeter is a creator management and payments platform for multi-channel
  networks, agencies, and brands. Founded in 2012 and headquartered in San
  Francisco, it provides an all-in-one suite for creator discovery, onboarding,
  contract management, analytics, and automated global payouts. Its Creator Pay
  product moves money to creators across 21+ currencies and 50+ countries, and
  Creator Cash offers cash advances to creators. ChannelMeter reports having
  processed over $1B in payments to more than one million creators, working with
  Stripe and Fifth Third Bank for financial services. The company is backed by
  500 Global.
